# ==============================================================================
# IncuBrix AI Background Music Engine — Render Cloud Deployment Blueprint
# Multi-service specification: FastAPI Gateway, Celery Worker, Postgres, Redis
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI Audio Engine Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: incubrix-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: standard
    region: oregon
    numInstances: 1
    healthCheckPath: /health
    envVars:
      - key: MUSIC_PROVIDER
        value: mock
      - key: DATABASE_URL
        fromDatabase:
          name: incubrix-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: incubrix-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: incubrix-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: incubrix-redis
          property: connectionString
      - key: CELERY_ENABLED
        value: "true"
      - key: STORAGE_BACKEND
        value: local
      - key: LOCAL_STORAGE_DIR
        value: /var/data/storage
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: MAX_UPLOAD_SIZE_BYTES
        value: "52428800"
      - key: LOG_LEVEL
        value: INFO
      # Production secrets to configure in Render Dashboard:
      # - key: SOUNDVERSE_API_KEY
      #   sync: false
      # - key: ELEVENLABS_API_KEY
      #   sync: false
      # - key: DEMO_API_KEY
      #   sync: false
    disk:
      name: api-audio-storage
      mountPath: /var/data/storage
      sizeGB: 10

  # ----------------------------------------------------------------------------
  # 2. Celery Asynchronous Audio Processing Worker
  # ----------------------------------------------------------------------------
  - type: worker
    name: incubrix-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: celery -A src.tasks.celery_app worker --loglevel=info --concurrency=2
    plan: standard
    region: oregon
    numInstances: 1
    envVars:
      - key: MUSIC_PROVIDER
        value: mock
      - key: DATABASE_URL
        fromDatabase:
          name: incubrix-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: incubrix-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: incubrix-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: incubrix-redis
          property: connectionString
      - key: CELERY_ENABLED
        value: "true"
      - key: STORAGE_BACKEND
        value: local
      - key: LOCAL_STORAGE_DIR
        value: /var/data/storage
      - key: LOG_LEVEL
        value: INFO
    disk:
      name: worker-audio-storage
      mountPath: /var/data/storage
      sizeGB: 10

  # ----------------------------------------------------------------------------
  # 3. React + TypeScript Dashboard (Web Service)
  # ----------------------------------------------------------------------------
  - type: web
    name: incubrix-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: starter
    region: oregon
    numInstances: 1
    healthCheckPath: /

# ==============================================================================
# Managed Databases
# ==============================================================================
databases:
  - name: incubrix-postgres
    plan: standard
    region: oregon
    databaseName: incubrix
    user: incubrix_admin

# Managed Redis Cache & Broker
redis:
  - name: incubrix-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: noeviction
