openapi: 3.1.0
info:
  title: IncuBrix AI Background Music Engine API
  description: 'AI Background Music Engine for Video: Generates original, commercially
    safe instrumental music timed to exact video edit points, with genuine multitrack
    stems, ITU-R BS.1770-4 loudness compliance, and voiceover sidechain ducking.'
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - Health
      summary: Service Liveness Check
      description: Returns HTTP 200 if the FastAPI application process is alive and
        responsive.
      operationId: get_health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Get Health Health Get
  /ready:
    get:
      tags:
      - Health
      summary: Service Readiness Check
      description: Verifies operational connectivity to PostgreSQL/SQLite and MinIO
        storage.
      operationId: get_ready_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Get Ready Ready Get
  /api/v1/music/jobs:
    post:
      tags:
      - Jobs
      summary: Create background music generation job
      description: Enqueue an asynchronous music generation and stem separation job.
        Supports Idempotency-Key header.
      operationId: create_music_job_api_v1_music_jobs_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      - name: X-Correlation-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Correlation-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MusicJobRequest'
      responses:
        '202':
          description: Job accepted and queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAcceptedResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '409':
          description: Idempotency key reuse conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs:
    get:
      tags:
      - Jobs
      summary: List all jobs
      description: Retrieve a list of music generation jobs ordered by creation date
        descending.
      operationId: list_jobs_api_v1_jobs_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobStatusResponse'
                title: Response List Jobs Api V1 Jobs Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}:
    get:
      tags:
      - Jobs
      summary: Get job status and download links
      description: Retrieve the execution progress, final audio download links, and
        manifest for a given job.
      operationId: get_job_status_api_v1_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Job details and status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '404':
          description: Job ID not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ErrorDetail:
      properties:
        code:
          type: string
          title: Code
          description: UPPER_SNAKE_CASE error code
        message:
          type: string
          title: Message
          description: Descriptive error message
        retryable:
          type: boolean
          title: Retryable
          description: Whether the request can be safely retried
          default: false
        details:
          additionalProperties: true
          type: object
          title: Details
          description: Additional context or validation details
      type: object
      required:
      - code
      - message
      title: ErrorDetail
      description: Standardized error structure per Integration Standard Point 5.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    JobAcceptedResponse:
      properties:
        job_id:
          type: string
          title: Job Id
          description: Unique job identifier
        status:
          type: string
          title: Status
          description: Initial job status ('queued')
          default: queued
        progress:
          type: integer
          maximum: 100.0
          minimum: 0.0
          title: Progress
          description: Job progress percentage (0-100)
          default: 0
        created_at:
          type: string
          title: Created At
          description: ISO 8601 creation timestamp
        message:
          type: string
          title: Message
          description: Human-readable status message
          default: Job accepted and queued for processing
      type: object
      required:
      - job_id
      - created_at
      title: JobAcceptedResponse
      description: HTTP 202 Accepted response returned on job creation.
    JobResultURLs:
      properties:
        mix_wav:
          type: string
          title: Mix Wav
          description: Direct download URL for finished 48kHz mix.wav
        mix_mp3:
          anyOf:
          - type: string
          - type: 'null'
          title: Mix Mp3
          description: Download URL for finished mix.mp3
        mix_ducked_wav:
          anyOf:
          - type: string
          - type: 'null'
          title: Mix Ducked Wav
          description: Download URL for narration-ducked mix.wav
        stems:
          additionalProperties:
            type: string
          type: object
          title: Stems
          description: Download URLs for individual instrument stems
        manifest:
          type: string
          title: Manifest
          description: Download URL for music_manifest.json
        validation_report:
          anyOf:
          - type: string
          - type: 'null'
          title: Validation Report
          description: Download URL for validation_report.json
      type: object
      required:
      - mix_wav
      - manifest
      title: JobResultURLs
      description: Download links to finished audio assets.
    JobStatusResponse:
      properties:
        job_id:
          type: string
          title: Job Id
        status:
          type: string
          title: Status
          description: 'Status: ''queued'', ''running'', ''succeeded'', ''failed'''
        progress:
          type: integer
          maximum: 100.0
          minimum: 0.0
          title: Progress
          description: Progress from 0 to 100
        result:
          anyOf:
          - $ref: '#/components/schemas/JobResultURLs'
          - type: 'null'
        manifest:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Manifest
        error:
          anyOf:
          - $ref: '#/components/schemas/ErrorDetail'
          - type: 'null'
        created_at:
          type: string
          title: Created At
        updated_at:
          type: string
          title: Updated At
      type: object
      required:
      - job_id
      - status
      - progress
      - created_at
      - updated_at
      title: JobStatusResponse
      description: Detailed job status returned by GET /api/v1/jobs/{job_id}.
    MusicJobRequest:
      properties:
        prompt:
          type: string
          minLength: 1
          title: Prompt
          description: Text prompt describing mood, genre, and instrumentation
        duration_s:
          type: number
          maximum: 300.0
          minimum: 5.0
          title: Duration S
          description: Duration in seconds (5.0 to 300.0s)
        sections:
          anyOf:
          - items:
              $ref: '#/components/schemas/SectionPlan'
            type: array
          - type: 'null'
          title: Sections
          description: Optional mood changes at video edit points
        tempo_bpm:
          anyOf:
          - type: integer
            maximum: 240.0
            minimum: 40.0
          - type: 'null'
          title: Tempo Bpm
          description: Optional fixed tempo in BPM
        key:
          anyOf:
          - type: string
          - type: 'null'
          title: Key
          description: Optional musical key (e.g., 'C major', 'A minor')
        loopable:
          type: boolean
          title: Loopable
          description: Whether audio must loop seamlessly
          default: false
        narration_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Narration Url
          description: Optional URL to voiceover audio for auto-ducking
        callback_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Callback Url
          description: Optional webhook URL to receive HMAC-signed job completion
        seed:
          anyOf:
          - type: integer
          - type: 'null'
          title: Seed
          description: Optional random seed for reproducible synthesis
        output:
          $ref: '#/components/schemas/OutputConfig'
          description: Output audio configuration
      type: object
      required:
      - prompt
      - duration_s
      title: MusicJobRequest
      description: Primary request payload matching the IncuBrix Integration Standard.
    OutputConfig:
      properties:
        sample_rate:
          type: integer
          title: Sample Rate
          description: 'Target sample rate in Hz (default: 48000)'
          default: 48000
        target_lufs:
          type: number
          title: Target Lufs
          description: 'Target integrated loudness in LUFS (default: -16.0)'
          default: -16.0
        formats:
          items:
            type: string
          type: array
          title: Formats
          description: Output container formats
      type: object
      title: OutputConfig
      description: Audio rendering and format settings.
    SectionPlan:
      properties:
        start_s:
          type: number
          minimum: 0.0
          title: Start S
          description: Start time in seconds
        mood:
          type: string
          minLength: 1
          title: Mood
          description: Mood or instrumentation instruction for this section
      type: object
      required:
      - start_s
      - mood
      title: SectionPlan
      description: Mood change section at a specific video cut point.
    StandardErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      type: object
      required:
      - error
      title: StandardErrorResponse
      description: Root error response schema.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
