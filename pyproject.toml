[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "incubrix-audio-gen"
version = "0.1.0"
description = "IncuBrix AI Background Music Engine - Audio Proof of Concept"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "IncuBrix AI Audio Engineer" }
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "soundfile>=0.12.0",
    "pyloudnorm>=0.1.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "pytest>=7.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
incubrix-audio = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
