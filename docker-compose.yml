version: "3.8"

services:
  # ============================================================================
  # 1. FastAPI Gateway
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incubrix_api
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head &&
             uvicorn src.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/incubrix
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERY_ENABLED=true
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=incubrix-audio
      - STORAGE_BACKEND=minio
      - MUSIC_PROVIDER=mock
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - incubrix_net

  # ============================================================================
  # 2. Celery Audio Processing Worker
  # ============================================================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incubrix_worker
    restart: unless-stopped
    command: celery -A src.tasks.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/incubrix
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERY_ENABLED=true
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=incubrix-audio
      - STORAGE_BACKEND=minio
      - MUSIC_PROVIDER=mock
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - incubrix_net

  # ============================================================================
  # 3. PostgreSQL Database
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: incubrix_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: incubrix
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - incubrix_net

  # ============================================================================
  # 4. Redis Task Broker & Cache
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: incubrix_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - incubrix_net

  # ============================================================================
  # 5. MinIO S3-Compatible Object Storage
  # ============================================================================
  minio:
    image: minio/minio:latest
    container_name: incubrix_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - incubrix_net

volumes:
  pgdata:
  miniodata:

networks:
  incubrix_net:
    driver: bridge
